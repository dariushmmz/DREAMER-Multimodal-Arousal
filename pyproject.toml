[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-classification"
version = "0.1.0"
description = "Leakage-audited multimodal DREAMER arousal classification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.11,<2.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.4,<2.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "PyYAML>=6.0,<7.0",
  "joblib>=1.3,<2.0",
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
modal = ["modal>=1.5,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stress_classification*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

